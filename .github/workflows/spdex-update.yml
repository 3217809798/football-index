# 竞彩指数页面自动更新（两种模式）
#   抓取轮（仅北京 9:00-16:00）：抓 bifaw（竞彩必发）→ 生成 dist/ → FTP 覆盖到 90qu.com 子目录
#   定稿轮（北京 16:30）：**不抓取**，把当天最后一份数据定稿成 /football/<日期>/ 归档页并上传
#   凭据全部来自仓库 Secrets；本地带密码的 publish.json / bifaw_conf.json 被 .gitignore 挡住，不进仓库
#
#   注：超级指数（c.spdex.com）已于 2026-09-16 下线（源站改成会员登录站），
#       publish.py 默认不再抓它，本工作流因此只剩竞彩必发一个源。
#
# ⚠️ 竞彩必发（bifaw.com）网页会识别无头浏览器，识别到就只回「undefined，请点击此处重新获取!」，
#    因此必须跑「有界面」的 Chrome —— CI 上用 xvfb 提供虚拟显示（xvfb-run），效果等同于有界面。
#
# ⚠️ 数据源只在「北京时间 9:00-16:00」提供服务（免费账号），16:00 之后抓必然是 0 场。
#    所以本工作流分三种模式，由第一步「服务时段预检」判定成 steps.window.outputs.mode：
#      · fetch    —— 北京 9:00-16:00：抓取 + 上传（数据文件与主页；归档不在这里写）
#      · finalize —— 北京 16:00-18:00：不抓取，只把当天最后一次抓到的数据定稿成归档页
#      · skip     —— 其余时间：整个 job 几秒结束，不装依赖、不抓取、不上传
#
# ⚠️ 百度主动推送（普通收录 → API提交）只在 **finalize 轮**跑一次（2026-09-19 调整）：
#    配额比文档小得多（实测推过 2 条之后 4 条的请求就 over quota），白天每 20 分钟推一轮
#    会把配额占满，轮到当天新归档页时反而推不动。
#    2026-09-20 起：清单扩到三个栏目（/football/ /jc/ /xg/）+ 两个栏目的当天归档页，
#    推送改成**逐条发送**（百度是整批校验，一批超配额就整批被拒），单轮上限 3 条，
#    常青页按「最久没推过」轮转 —— 这样 /jc/、/xg/ 这些从没被推过的页面也能排上队。
#
# ⚠️ 归档为什么单独一轮（2026-09-19 用户要求）：数据到 16:00 才停止更新，而 16:00 之后
#    我们就抓不到了 —— 服务时段内任何时刻生成的归档都只是「当日半成品」。改成每天 16:30
#    统一「定稿」一次，归档页才真正代表「这一天最终长什么样」，页面上的时间口径也统一写成
#    「<日期> 16:30 定稿」，不再出现各轮各不相同的抓取时刻。
#
# 两层闸门：
#   第一层 · 时段预检（「服务时段预检」步骤）：cron 之外再算一次北京时间，窗口外就把后面的
#           重步骤（拉仓库、装 Python、装 playwright/ddddocr、抓取、上传、回写）全部 if 掉。
#           cron 在 UTC 侧没法精确表达「北京 9-16」，且 GitHub 定时会延迟，这一层专治跑偏的轮次。
#   第二层 · 权威闸门（publish.py 的 SERVICE_OPEN/SERVICE_CLOSE + service_state()）：
#           真正说了算的一层。预检只有分钟级精度，万一某轮踩着 16:00 进来，
#           脚本会自己 RESULT: SKIP 退出，一个文件都不传。
#
# 想改成只在数据变化时上传，把下面 run 里的 --upload 换成 --upload --only-data 即可。
name: spdex-update

on:
  schedule:
    # 抓取轮（北京时间 = UTC+8，所以 UTC 01:00-07:59 正好是北京 09:00-15:59）：
    #   */20 1-7 —— 北京 9:00-15:40 每 20 分钟一次
    #   50 7 / 55 7 —— 15:50 与 15:55 各再来一次，尽量贴近 16:00 截止线，
    #     让当天那份「最终数据」尽量新（GitHub 定时是尽力而为、常延迟 3-15 分钟，
    #     15:55 那条大概率落在 15:58-16:10；落在窗口内就白赚一次更新，
    #     落在窗口外也只花几秒被预检挡掉）
    # 定稿轮（北京 16:30 / 16:50 = UTC 08:30 / 08:50）：
    #   30 8 —— 把当天最后一次抓到的数据定稿成 /football/<日期>/ 归档页
    #   50 8 —— 重试；已经定稿过的会直接 SKIP，不重复上传、零副作用
    #
    # ⚠️ GitHub 改 cron 之后旧排程可能还会多跑一阵，那批轮次全部由「时段预检」几秒挡掉。
    - cron: "*/20 1-7 * * *"
    - cron: "50 7 * * *"
    - cron: "55 7 * * *"
    - cron: "30 8 * * *"
    - cron: "50 8 * * *"
  # 允许在 Actions 页面点一下就跑，用来临时补一次 / 验证配置
  workflow_dispatch:

# 同一时刻只允许一个发布任务；后到的排队而不是取消，避免线上文件被两个任务同时改
concurrency:
  group: spdex-publish
  cancel-in-progress: false

# contents: write 只给「回写数据快照到仓库」那一步用（见下面同名步骤）。
# 用 GitHub 自动注入的 GITHUB_TOKEN，不需要额外的 Personal Access Token。
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---- 第一层闸门：时段预检 ---------------------------------------------
      # 放在所有步骤最前面：不需要 checkout、不需要装任何东西，判定为 skip 时整个 job 几秒结束。
      # 边界刻意与 publish.py 的 SERVICE_OPEN=(9,0) / SERVICE_CLOSE=(16,0) 保持一致；
      # 用 env 里的 TZ 让 date 直接给北京时间，不看 Runner 的本地时区。
      # 三种模式：
      #   fetch    —— 9:00-16:00，抓取并上传
      #   finalize —— 16:00-18:00，归档定稿（不抓取；16:30 与 16:50 两条 cron 落在这一段）
      #   skip     —— 其余时间
      - name: 服务时段预检
        id: window
        env:
          TZ: Asia/Shanghai
        run: |
          now=$(date '+%F %H:%M')
          # 10# 前缀：%H%M 会带前导零（如 0920），避免被当成八进制
          hm=$((10#$(date '+%H%M')))
          if [ "$hm" -ge 900 ] && [ "$hm" -lt 1600 ]; then
            mode=fetch
            echo "现在 $now（北京），数据服务时段内 → 抓取并发布。"
          elif [ "$hm" -ge 1600 ] && [ "$hm" -lt 1800 ]; then
            mode=finalize
            echo "现在 $now（北京），已过数据截止（16:00）→ 归档定稿模式：不抓取，用当天最后一份数据定稿归档页。"
          else
            mode=skip
            echo "现在 $now（北京），既不在服务时段也不是定稿窗口 → 本轮跳过：不装依赖、不抓取、不上传。"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "bj_now=$now" >> "$GITHUB_OUTPUT"

      - name: 拉取仓库
        if: steps.window.outputs.mode != 'skip'
        uses: actions/checkout@v4

      - name: 准备 Python
        if: steps.window.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只有抓取轮才需要浏览器和 OCR —— 定稿轮不抓数据，装它们纯属浪费时间。
      - name: 安装抓取依赖
        if: steps.window.outputs.mode == 'fetch'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip -q
          # playwright 驱动浏览器；ddddocr 负责过必发指数网的 4 位图形验证码
          python -m pip install playwright ddddocr
          echo "--- 可用的浏览器 ---"
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium; do
            [ -x "$b" ] && echo "FOUND $b"
          done

      # publish.py 需要根目录有 publish.json；这份是现场生成的，不来自仓库
      - name: 由 Secrets 生成 publish.json
        if: steps.window.outputs.mode != 'skip'
        env:
          FTP_MODE: ${{ secrets.FTP_MODE }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_USE_TLS: ${{ secrets.FTP_USE_TLS }}
        run: python build_publish_conf.py

      # 不用 set -e：要自己拿到退出码再决定成败，避免脚本一失败日志就断在这里
      - name: 抓取并上传
        id: publish
        if: steps.window.outputs.mode == 'fetch'
        env:
          TZ: Asia/Shanghai
          BIFAW_USER: ${{ secrets.BIFAW_USER }}
          BIFAW_PWD: ${{ secrets.BIFAW_PWD }}
        run: |
          set +e
          # xvfb-run -a 自动挑一个空闲显示号；bifaw 的浏览器必须「有界面」才能拿到数据
          xvfb-run -a python publish.py --upload 2>&1 | tee publish.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # 归档定稿（每天 16:30 / 16:50）：
      #   ⚠️ 这一轮**不抓取** —— 16:00 之后源站就不给数据了，抓也是 0 场。
      #      它读的是仓库里那份当天快照（由下面的「回写」步骤持续提交，最多落后 20 分钟），
      #      生成 /football/<日期>/ 归档页 + 归档索引 + sitemap 并上传。
      #   ⚠️ 不需要 xvfb / playwright / ddddocr，所以跑得很快。
      #   ⚠️ 三条护栏在 publish.py 里（数据必须是今天 / 必须已过 16:00 / 这天还没定稿），
      #      不满足就 RESULT: SKIP 退出，视为正常。
      - name: 归档定稿（16:30）
        id: finalize
        if: steps.window.outputs.mode == 'finalize'
        env:
          TZ: Asia/Shanghai
        run: |
          set +e
          python publish.py --finalize --upload 2>&1 | tee finalize.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # 主动推送给百度（普通收录 → API提交）：
      #   让百度尽快重抓数据页，不用等爬虫自己排期。
      #   ⚠️ **只在定稿轮推**（2026-09-19 调整）。原因：
      #        ① 配额比文档小得多（09-19 实测：当天推过 2 条后，再推 4 条就
      #           HTTP 400 {"error":400,"message":"over quota"}），
      #           白天每 20 分钟推一轮会把配额的坑占满，轮到当天新归档页时反而推不动；
      #        ② 主动推送最值钱的是**全新 URL**，而一天里的新 URL 就是 16:30 才生成的
      #           /football/<今天>/ 与 /jc/<今天>/ 两个归档页。
      #   ⚠️ 清单与顺序由 baidu_push.py 决定（2026-09-20 扩到三个栏目）：
      #        当天新归档页 → /football/ /jc/ /xg/ 三个栏目主页（按最久没推过轮转）
      #        → 归档索引页 → 历史归档页。--max 3 单轮推 3 条；推送是**逐条发送**的，
      #        配额不够时「推一条算一条」并在 over quota 处立刻停止。
      #        （旧版只推 /football/ 一条线，/jc/、/xg/ 因此一次都没被推过。）
      #   ⚠️ 每个 URL 每天最多推一次 —— `--daily` 靠仓库里的 .baidu-push-state 记账，
      #      该文件由下面的「回写」步骤提交，否则每轮都会重复推。
      #   ⚠️ 推送失败绝不判红：本步骤一律 exit 0，真正的发布结果仍由上面两步的 rc 决定。
      #      配额用尽（over quota）在脚本里算 SKIP，不算 FAIL。
      - name: 推送给百度
        if: always() && steps.window.outputs.mode == 'finalize'
        env:
          MODE: ${{ steps.window.outputs.mode }}
          FIN_RC: ${{ steps.finalize.outputs.rc }}
          BAIDU_PUSH_SITE: ${{ secrets.BAIDU_PUSH_SITE }}
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          # 这个步骤只在定稿轮跑（见步骤条件），所以只需要认定稿轮的两个前提：
          #   ① 定稿本身成功（rc=0）  ② 状态里 archive_ok=1（本轮确实产出了新归档）
          # ⚠️ 定稿轮不抓数据，data_ok 恒为 0 —— 拿 data_ok 判断会永远不推。
          if [ ! -f .publish-state ]; then
            echo "没有 .publish-state（定稿轮整体跳过：已定稿过 / 还没到定稿时间 / 今天没数据）→ 不推百度"
            exit 0
          fi
          if [ "$FIN_RC" != "0" ]; then
            echo "本轮归档定稿没成功（rc=$FIN_RC）→ 不推百度"
            exit 0
          fi
          if ! grep -q '^archive_ok=1$' .publish-state; then
            echo "本轮没有新定稿的归档 → 不推百度"
            exit 0
          fi
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "::warning::没配置 BAIDU_PUSH_TOKEN secret，跳过百度推送"
            exit 0
          fi
          set +e
          # --max 3：当天两个新归档页 + 一个最久没推过的常青页；
          # 推送是逐条发的，配额不够时自动在 over quota 处停下。
          python baidu_push.py --daily --max 3 2>&1 | tee baidu-push.log
          set -e
          echo "--- 推送结果行 ---"
          grep -E '^RESULT: ' baidu-push.log | tail -1 || true

      # 把本轮抓到的新数据回写仓库（2026-09-18 加固）：
      #   CI 每次都是全新 checkout，所谓「保留上一份」恢复的其实是**仓库里提交的那份快照**。
      #   仓库里的快照越旧，一旦某轮抓取失败仍把数据传上去，线上就被倒退得越多
      #   （2026-09-18 的真实事故：仓库停在 09-17，晚上的失败轮次把线上的当天数据覆盖了）。
      #   回写之后，仓库快照最多只落后一轮（≈20 分钟），任何意外上传最多倒退一轮。
      #   只有 publish.py 写的 .publish-state 里 data_ok=1（本轮真抓到可上线数据）才提交；
      #   服务时段外 SKIP、抓取失败、只是重传页面文件 —— 这几种情况一律不提交。
      - name: 回写数据快照到仓库
        if: always()
        run: |
          set -e
          if [ ! -f .publish-state ]; then
            echo "没有 .publish-state（本轮没跑到写状态那一步 / 整体跳过）→ 跳过回写"
            exit 0
          fi
          echo "--- .publish-state ---"
          cat .publish-state
          echo "----------------------"
          # 两种产出都要回写：
          #   data_ok=1    → 抓取轮抓到的新数据快照（bf.json / bf-inline.js）
          #   archive_ok=1 → 定稿轮产出的归档清单（.archive-index.json）
          # ⚠️ 定稿轮不抓数据，data_ok 恒为 0 —— 所以不能只看 data_ok，
          #    否则当天归档的日期永远提交不回仓库，下一轮/次日重建索引页与 sitemap
          #    时就会把这一天漏掉（只剩今天一天）。
          if ! grep -q '^data_ok=1$' .publish-state && ! grep -q '^archive_ok=1$' .publish-state; then
            echo "本轮既没抓到新数据、也没有新定稿的归档 → 跳过回写（仓库里的快照保持原样）"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bf.json bf-inline.js
          # 百度主动推送的「今天已推过哪些 URL」也要落仓库：
          # CI 每次全新 checkout，不提交的话下一轮会当成「今天还没推」而重复推送，白烧配额。
          # 它只记录 URL + 北京日期，不含任何凭据。
          if [ -f .baidu-push-state ]; then git add .baidu-push-state; fi
          # 归档清单（第三档）：记录了「历史上有哪些天被归档了」。
          # CI 全新 checkout，不落仓库的话下一轮就不知道昨天/前天的归档页存在，
          # /football/archive/ 索引页与 sitemap 会把它漏掉（只剩今天一天）。
          # 里面只有日期 + 场次数 + 联赛名 + 定稿标记，同样不含凭据。
          if [ -f .archive-index.json ]; then git add .archive-index.json; fi
          if git diff --cached --quiet; then
            echo "仓库里的快照与本轮数据一致，无需提交"
            exit 0
          fi
          git commit -m "data: 竞彩必发快照 $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 并发已被 concurrency 串起来，正常不会撞；万一被 keepalive 之类抢先，rebase 后重试一次
          git push || { echo "推送被拒，rebase 后重试一次"; git pull --rebase --autostash; git push; }

      # 把结果写进 Job Summary，Actions 页面直接能看，不用点进日志
      - name: 汇总结果
        if: always()
        env:
          TZ: Asia/Shanghai
          MODE: ${{ steps.window.outputs.mode }}
          PUB_RC: ${{ steps.publish.outputs.rc }}
          FIN_RC: ${{ steps.finalize.outputs.rc }}
          BJ_NOW: ${{ steps.window.outputs.bj_now }}
        run: |
          # 本轮到底是哪一种模式，决定看哪个日志、看哪个退出码
          LOG=""
          RC=""
          case "$MODE" in
            fetch)    LOG=publish.log;  RC="$PUB_RC" ;;
            finalize) LOG=finalize.log; RC="$FIN_RC" ;;
            *)        RC="skipped" ;;
          esac
          if [ -z "$LOG" ]; then
            RESULT="RESULT: SKIP - 既不在服务时段也不是定稿窗口，本轮整体跳过"
            TAIL="（本轮什么都没跑，没有日志）"
          else
            RESULT=$(grep -E '^RESULT: (OK|WARN|FAIL|SKIP)' "$LOG" | tail -1 || true)
            [ -n "$RESULT" ] || RESULT="RESULT: UNKNOWN - 日志里没有结果行"
            TAIL=$(tail -40 "$LOG" || true)
          fi
          # .publish-state 是「本轮产出了什么」的唯一凭据：data_ok / archive_ok
          if [ -f .publish-state ]; then
            STATE=$(tr '\n' ' ' < .publish-state)
          else
            STATE="（无）"
          fi
          # 百度主动推送的结果（本轮没推就没有这个日志）
          BAIDU=$(grep -E '^RESULT: ' baidu-push.log 2>/dev/null | tail -1 || true)
          [ -n "$BAIDU" ] || BAIDU="（本轮未推送）"
          {
            echo "### 竞彩指数自动更新"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 运行时间 | $(date '+%Y-%m-%d %H:%M:%S %Z') |"
            echo "| 北京预检 | ${BJ_NOW:-未知} |"
            echo "| 本轮模式 | \`${MODE:-未知}\`（fetch=抓取 / finalize=归档定稿 / skip=跳过） |"
            echo "| 结束代码 | \`${RC:-未知}\` |"
            echo "| 结果 | \`$RESULT\` |"
            echo "| 状态 | \`$STATE\` |"
            echo "| 百度推送 | \`$BAIDU\` |"
            echo ""
            echo "<details><summary>日志末尾 40 行</summary>"
            echo ""
            echo '```'
            echo "$TAIL"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时留一份日志
        if: always() && ((steps.window.outputs.mode == 'fetch' && steps.publish.outputs.rc != '0') || (steps.window.outputs.mode == 'finalize' && steps.finalize.outputs.rc != '0'))
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_number }}
          path: |
            publish.log
            finalize.log
            baidu-push.log
            logs/
          retention-days: 14

      # 退出码含义见 publish.py 文件头：
      #   0 = 成功（含「无事可做」的 SKIP：已定稿 / 今天没数据 / 还没到定稿时间）
      #   2 = 数据不完整（没抓到数据，已保留旧数据，下一轮自动重试）
      #   1 = 配置缺失 / 上传失败 —— 这个才值得把人叫醒
      #   模式为 skip 时 rc 是空的，必须单独放行，否则会被当成「配置缺失」把 job 判红
      - name: 判断是否真的失败
        if: always()
        env:
          MODE: ${{ steps.window.outputs.mode }}
          PUB_RC: ${{ steps.publish.outputs.rc }}
          FIN_RC: ${{ steps.finalize.outputs.rc }}
        run: |
          if [ "$MODE" = "skip" ]; then
            echo "既不在服务时段也不是定稿窗口，本轮整体跳过（正常行为，不是失败）"
            exit 0
          fi
          if [ "$MODE" = "finalize" ]; then
            RC="$FIN_RC"
            WHAT="归档定稿"
          else
            RC="$PUB_RC"
            WHAT="抓取发布"
          fi
          case "${RC:-1}" in
            0)
              echo "$WHAT成功"
              ;;
            2)
              echo "::warning::本轮$WHAT没拿到可用数据（已保留旧数据），下一轮会自动重试（无需处理）"
              ;;
            *)
              echo "::error::$WHAT失败。多数情况是 FTP 密码/目录变了：先在本地跑 python publish.py --check 定位，再更新 Secrets"
              exit 1
              ;;
          esac
