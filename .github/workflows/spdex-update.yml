# 竞彩指数页面自动更新
#   每 20 分钟（仅北京 9:00-16:00）：抓 bifaw（竞彩必发）→ 生成 dist/ → FTP 覆盖到 90qu.com 子目录
#   凭据全部来自仓库 Secrets；本地带密码的 publish.json / bifaw_conf.json 被 .gitignore 挡住，不进仓库
#
#   注：超级指数（c.spdex.com）已于 2026-09-16 下线（源站改成会员登录站），
#       publish.py 默认不再抓它，本工作流因此只剩竞彩必发一个源。
#
# ⚠️ 竞彩必发（bifaw.com）网页会识别无头浏览器，识别到就只回「undefined，请点击此处重新获取!」，
#    因此必须跑「有界面」的 Chrome —— CI 上用 xvfb 提供虚拟显示（xvfb-run），效果等同于有界面。
#
# ⚠️ 数据源只在「北京时间 9:00-16:00」提供服务（免费账号），16:00 之后抓必然是 0 场。
#    所以本工作流是「两层闸门」：
#      第一层 · 时段预检（下面的「服务时段预检」步骤，2026-09-18 加）：
#              cron 之外再算一次北京时间，窗口外就把后面的重步骤（拉仓库、装 Python、
#              装 playwright/ddddocr、抓取、上传、回写）全部 if 掉 —— 整轮只花几秒，
#              不白装依赖。cron 在 UTC 侧没法精确表达「北京 9-16」，且 GitHub 定时会延迟，
#              这一层专门兜住那些跑到窗口外的轮次。
#      第二层 · 权威闸门（publish.py 的 SERVICE_OPEN/SERVICE_CLOSE + service_state()）：
#              真正说了算的一层。预检只有分钟级精度，万一某轮踩着 16:00 进来，
#              脚本会自己 RESULT: SKIP 退出，一个文件都不传。
#
# 想改成只在数据变化时上传，把下面 run 里的 --upload 换成 --upload --only-data 即可。
name: spdex-update

on:
  schedule:
    # 只在「北京时间 9:00-16:00」数据服务时段内跑：
    #   北京时间 = UTC+8，所以 UTC 01:00-08:00 正好是北京 09:00-16:00。
    #   这里取小时 1-7（不含 8）每 20 分钟一次，再加一条 07:50（北京 15:50）
    #   尽量贴近 16:00 截止线再抓一次，让当天「截止数据」尽量新。
    #
    # ⚠️ GitHub 改 cron 之后旧排程可能还会多跑一阵，那批轮次全部由「时段预检」几秒挡掉。
    - cron: "*/20 1-7 * * *"
    - cron: "50 7 * * *"
  # 允许在 Actions 页面点一下就跑，用来临时补一次 / 验证配置
  workflow_dispatch:

# 同一时刻只允许一个发布任务；后到的排队而不是取消，避免线上文件被两个任务同时改
concurrency:
  group: spdex-publish
  cancel-in-progress: false

# contents: write 只给「回写数据快照到仓库」那一步用（见下面同名步骤）。
# 用 GitHub 自动注入的 GITHUB_TOKEN，不需要额外的 Personal Access Token。
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---- 第一层闸门：时段预检 ---------------------------------------------
      # 放在所有步骤最前面：不需要 checkout、不需要装任何东西，窗口外整个 job 几秒结束。
      # 边界刻意与 publish.py 的 SERVICE_OPEN=(9,0) / SERVICE_CLOSE=(16,0) 保持一致；
      # 用 env 里的 TZ 让 date 直接给北京时间，不看 Runner 的本地时区。
      - name: 服务时段预检
        id: window
        env:
          TZ: Asia/Shanghai
        run: |
          now=$(date '+%F %H:%M')
          # 10# 前缀：%H%M 会带前导零（如 0920），避免被当成八进制
          hm=$((10#$(date '+%H%M')))
          if [ "$hm" -ge 900 ] && [ "$hm" -lt 1600 ]; then
            in_window=true
            echo "现在 $now（北京），在服务时段内 → 继续抓取。"
          else
            in_window=false
            echo "现在 $now（北京），在服务时段外（9:00-16:00 之外）→ 本轮跳过：不装依赖、不抓取、不上传。"
          fi
          echo "in_window=$in_window" >> "$GITHUB_OUTPUT"
          echo "bj_now=$now" >> "$GITHUB_OUTPUT"

      - name: 拉取仓库
        if: steps.window.outputs.in_window == 'true'
        uses: actions/checkout@v4

      - name: 准备 Python
        if: steps.window.outputs.in_window == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装抓取依赖
        if: steps.window.outputs.in_window == 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          python -m pip install --upgrade pip -q
          # playwright 驱动浏览器；ddddocr 负责过必发指数网的 4 位图形验证码
          python -m pip install playwright ddddocr
          echo "--- 可用的浏览器 ---"
          for b in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium; do
            [ -x "$b" ] && echo "FOUND $b"
          done

      # publish.py 需要根目录有 publish.json；这份是现场生成的，不来自仓库
      - name: 由 Secrets 生成 publish.json
        if: steps.window.outputs.in_window == 'true'
        env:
          FTP_MODE: ${{ secrets.FTP_MODE }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_USE_TLS: ${{ secrets.FTP_USE_TLS }}
        run: python build_publish_conf.py

      # 不用 set -e：要自己拿到退出码再决定成败，避免脚本一失败日志就断在这里
      - name: 抓取并上传
        id: publish
        if: steps.window.outputs.in_window == 'true'
        env:
          TZ: Asia/Shanghai
          BIFAW_USER: ${{ secrets.BIFAW_USER }}
          BIFAW_PWD: ${{ secrets.BIFAW_PWD }}
        run: |
          set +e
          # xvfb-run -a 自动挑一个空闲显示号；bifaw 的浏览器必须「有界面」才能拿到数据
          xvfb-run -a python publish.py --upload 2>&1 | tee publish.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # 把本轮抓到的新数据回写仓库（2026-09-18 加固）：
      #   CI 每次都是全新 checkout，所谓「保留上一份」恢复的其实是**仓库里提交的那份快照**。
      #   仓库里的快照越旧，一旦某轮抓取失败仍把数据传上去，线上就被倒退得越多
      #   （2026-09-18 的真实事故：仓库停在 09-17，晚上的失败轮次把线上的当天数据覆盖了）。
      #   回写之后，仓库快照最多只落后一轮（≈20 分钟），任何意外上传最多倒退一轮。
      #   只有 publish.py 写的 .publish-state 里 data_ok=1（本轮真抓到可上线数据）才提交；
      #   服务时段外 SKIP、抓取失败、只是重传页面文件 —— 这几种情况一律不提交。
      - name: 回写数据快照到仓库
        if: always()
        run: |
          set -e
          if [ ! -f .publish-state ]; then
            echo "没有 .publish-state（本轮没跑到写状态那一步 / 时段外整体跳过）→ 跳过回写"
            exit 0
          fi
          echo "--- .publish-state ---"
          cat .publish-state
          echo "----------------------"
          if ! grep -q '^data_ok=1$' .publish-state; then
            echo "本轮没有抓到可上线的新数据 → 跳过回写（仓库里的快照保持原样）"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bf.json bf-inline.js
          if git diff --cached --quiet; then
            echo "仓库里的快照与本轮数据一致，无需提交"
            exit 0
          fi
          git commit -m "data: 竞彩必发快照 $(date -u '+%Y-%m-%d %H:%M') UTC"
          # 并发已被 concurrency 串起来，正常不会撞；万一被 keepalive 之类抢先，rebase 后重试一次
          git push || { echo "推送被拒，rebase 后重试一次"; git pull --rebase --autostash; git push; }

      # 把结果写进 Job Summary，Actions 页面直接能看，不用点进日志
      - name: 汇总结果
        if: always()
        env:
          TZ: Asia/Shanghai
          RC: ${{ steps.publish.outputs.rc }}
          IN_WINDOW: ${{ steps.window.outputs.in_window }}
          BJ_NOW: ${{ steps.window.outputs.bj_now }}
        run: |
          if [ "$IN_WINDOW" != "true" ]; then
            RESULT="RESULT: SKIP - 服务时段外（北京 9:00-16:00 之外），本轮整体跳过"
            RC="skipped"
            TAIL="（本轮没跑抓取，没有日志）"
          else
            RESULT=$(grep -E '^RESULT: (OK|WARN|FAIL|SKIP)' publish.log | tail -1 || true)
            [ -n "$RESULT" ] || RESULT="RESULT: UNKNOWN - 日志里没有结果行"
            TAIL=$(tail -40 publish.log || true)
          fi
          {
            echo "### 竞彩指数自动更新"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 运行时间 | $(date '+%Y-%m-%d %H:%M:%S %Z') |"
            echo "| 北京预检 | ${BJ_NOW:-未知} |"
            echo "| 结束代码 | \`${RC:-未知}\` |"
            echo "| 结果 | \`$RESULT\` |"
            echo ""
            echo "<details><summary>日志末尾 40 行</summary>"
            echo ""
            echo '```'
            echo "$TAIL"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 失败时留一份日志
        if: always() && steps.window.outputs.in_window == 'true' && steps.publish.outputs.rc != '0'
        uses: actions/upload-artifact@v4
        with:
          name: publish-log-${{ github.run_number }}
          path: |
            publish.log
            logs/
          retention-days: 14

      # 退出码含义见 publish.py 文件头：
      #   0 = 成功
      #   2 = 数据不完整（竞彩必发没抓到，已保留旧数据，下一轮自动重试）
      #   1 = 配置缺失 / 上传失败 —— 这个才值得把人叫醒
      #   时段外整体跳过时 rc 是空的，必须单独放行，否则会被当成「配置缺失」把 job 判红
      - name: 判断是否真的失败
        if: always()
        env:
          RC: ${{ steps.publish.outputs.rc }}
          IN_WINDOW: ${{ steps.window.outputs.in_window }}
        run: |
          if [ "$IN_WINDOW" != "true" ]; then
            echo "服务时段外，本轮整体跳过（正常行为，不是失败）"
            exit 0
          fi
          case "${RC:-1}" in
            0)
              echo "发布成功"
              ;;
            2)
              echo "::warning::本轮竞彩必发没抓到（已保留旧数据），下一轮会自动重试（无需处理）"
              ;;
            *)
              echo "::error::发布失败。多数情况是 FTP 密码/目录变了：先在本地跑 python publish.py --check 定位，再更新 Secrets"
              exit 1
              ;;
          esac
