<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>足球指数中心 · 超级指数与竞彩必发</title>
<meta name="description" content="竞彩足球指数数据页面：超级指数（c.spdex.com）与竞彩必发（bifaw.com）两个数据源，展示每场比赛的指数、交易量、比例、赔付、价位、挂牌指数、欧洲平均、凯利方差等数据。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E" />
<meta property="og:type" content="website" />
<meta property="og:title" content="足球指数中心 · 竞彩交易量与超级指数" />
<meta property="og:description" content="竞彩足球交易量、比例、赔付、价位、挂牌指数、欧洲平均、凯利方差与大小球指数。" />
<style>
/* ============ 基础 ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --navh:64px;              /* 站点导航条高度；小屏改为 0（导航条不再吸顶） */
  /* 原站 c.spdex.com/spdexlehejc 的橙色系 */
  --brand:#ff9900;          /* 主橙：场次标题条 / 分页当前页 */
  --brand-d:#e88a00;        /* 深橙：hover */
  --head:#ffe6c0;           /* 表头底色 */
  --row:#f0f0f0;            /* 数据格底色 */
  --row-team:#fff7ea;       /* 队名列底色 */
  --row-hover:#e9ecf1;      /* 行悬停 */
  --bar:#ffe4bb;            /* 底部数据条 */
  --bar-2:#ffd699;          /* 总成交格 */
  --bar-ink:#6b4a00;        /* 总成交格文字 */
  --cream-l:#ffe6c0;        /* 标题条上的浅色文字 */
  --ink:#2b3440;
  --ink-2:#596676;
  --up:#d92b2b;             /* 正 → 红（国内习惯） */
  --down:#0a9d54;           /* 负 → 绿 */
}
html,body{margin:0;padding:0}
body{
  background:#eef1f5;
  color:var(--ink);
  font:13px/1.5 "Microsoft YaHei","PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:#333;text-decoration:none}
a:hover{color:#c60}
.wrap{width:986px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 24px rgba(31,45,61,.08)}

/* ============ 站点导航条 ============
   照 90qu.com 首页（zibll 主题）复刻：底色 #216d01、白色 15px 菜单、同一个 logo。
   两点刻意的差异：
   1) 内层宽度对齐本页正文 986px —— 否则宽屏上 logo 会跑到最左边，
      与下方白色面板的左边缘对不齐，看起来像两截；
   2) 小屏（≤760px）收成汉堡菜单并且**不再吸顶**，把竖屏高度让给数据工具条。
   导航条一改高度，记得同步 :root 的 --navh（工具条与 toast 都靠它避让）。 */
.sitenav{
  position:sticky;top:0;z-index:90;
  background:#216d01;color:#fff;font-size:15px;
  box-shadow:0 1px 0 rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.14)
}
.sitenav-in{
  max-width:986px;margin:0 auto;padding:0 12px;height:var(--navh);
  display:flex;align-items:center;position:relative
}
.sn-brand{display:flex;align-items:center;flex:0 0 auto;margin-right:10px}
.sn-brand img{display:block;height:34px;width:auto}
.sn-menu{
  display:flex;align-items:center;gap:2px;flex:1 1 auto;min-width:0;
  list-style:none;margin:0;padding:0
}
.sn-menu a{
  display:block;padding:15px 10px;line-height:20px;border-radius:4px;
  color:#fff;font-size:15px;white-space:nowrap;transition:background .15s
}
.sn-menu a:hover{background:rgba(255,255,255,.16);color:#fff}
.sn-menu li.on a{background:rgba(0,0,0,.18);font-weight:700}
.sn-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:auto}
.sn-burger{
  display:none;width:34px;height:30px;padding:0;cursor:pointer;
  border:1px solid rgba(255,255,255,.5);border-radius:4px;background:transparent
}
.sn-burger span{display:block;width:16px;height:2px;margin:3px auto;border-radius:1px;background:#fff}

/* ============ 顶栏 ============ */
.nbar{
  display:flex;align-items:center;gap:14px;height:52px;padding:0 12px;
  background:#fafafa;border-bottom:1px solid #ddd;
}
.door{display:flex;align-items:center;gap:6px;flex:0 0 auto;color:#455569;white-space:nowrap}
.door label{font-weight:700;font-size:12px}
.door select{
  font:13px/1.4 inherit;padding:3px 6px;border:1px solid #d5d9e0;border-radius:4px;
  background:#fff;color:#455569;cursor:pointer
}
/* 交易播报跑马灯 */
.ticker{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;height:24px;color:#455569;font-size:12px}
.ticker::after{content:"";position:absolute;top:0;right:0;width:40px;height:100%;
  background:linear-gradient(90deg,rgba(250,250,250,0),#fafafa)}
.ticker-track{position:absolute;white-space:nowrap;will-change:transform;animation:tick 60s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker b{color:#3300ff}
.ticker u{color:var(--up);text-decoration:none;font-weight:700}
.logo{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#ffb340,#f28100);
  display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 1px 3px rgba(242,129,0,.5)}
.logo-text{line-height:1.1}
.logo-text strong{display:block;font-size:14px;letter-spacing:.5px}
.logo-text span{display:block;font-size:10px;color:#9aa3ae;letter-spacing:1px}

/* ============ 工具条 ============ */
.toolbar{
  /* top 让出顶部站点导航条的高度（小屏 --navh 为 0，见响应式段） */
  position:sticky;top:var(--navh,0px);z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 12px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid #e3e6eb;
}
.toolbar input[type=search]{
  font:13px/1.4 inherit;padding:6px 10px;width:180px;border:1px solid #d5d9e0;border-radius:5px;outline:none
}
.toolbar input[type=search]:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,153,0,.18)}
.toolbar select{font:13px/1.4 inherit;padding:6px 8px;border:1px solid #d5d9e0;border-radius:5px;background:#fff;cursor:pointer}
.btn{
  font:13px/1.4 inherit;padding:6px 12px;border:1px solid #d5d9e0;border-radius:5px;
  background:#fff;color:var(--ink-2);cursor:pointer
}
.btn:hover{border-color:var(--brand);color:var(--brand-d)}
.stats{margin-left:auto;font-size:12px;color:#8a939e;white-space:nowrap}
.stats em{font-style:normal;color:var(--brand-d);font-weight:700}
/* 数据新鲜度标记：抓取时间距今多久 */
.stats .age{display:inline-block;margin-left:2px;padding:0 6px;border-radius:3px;
  background:#eef1f5;color:#7d8794;font-weight:700}
.stats .age.warn{background:#fff3da;color:#a06a2c}
.stats .age.bad{background:#fdecec;color:#c0392b}

/* ============ 数据过期提示条 ============
   放进 sticky 工具条里独占一行，滚动时始终可见 —— 目的就是别再让人
   以为屏幕上这份「几天前的数据」是最新的。 */
.stalebar{
  flex:1 1 100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border:1px solid #e8c07a;background:#fff8e6;color:#7a5a12;
  border-radius:5px;padding:7px 10px;font-size:12.5px;line-height:1.55
}
.stalebar.bad{border-color:#e2948f;background:#fdecec;color:#a12a26}
.stalebar b{font-weight:800}
.stalebar button{
  font:inherit;font-size:12px;font-weight:700;cursor:pointer;
  border:1px solid currentColor;background:transparent;color:inherit;
  border-radius:4px;padding:2px 9px
}
.stalebar button:hover{background:rgba(0,0,0,.06)}

/* ============ 单场比赛 ============ */
.match{margin-top:14px}
.datatitle{
  display:flex;align-items:center;gap:10px;height:30px;padding:0 10px;
  background:var(--brand);color:#fff;cursor:pointer;user-select:none;
  transition:background .15s
}
.datatitle:hover{background:var(--brand-d)}
.datatitle:focus-visible{outline:2px solid #1a73e8;outline-offset:-2px}
.datatitle h3{
  margin:0;flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;
  padding-left:18px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
/* 折叠箭头 */
.datatitle h3::before{
  content:"";position:absolute;left:3px;top:50%;width:0;height:0;
  border:5px solid transparent;border-top-color:#fff;transform:translateY(-3px);
  transition:transform .2s
}
.match.collapsed .datatitle h3::before{transform:translateY(-6px) rotate(-90deg)}
.datatitle .matchtime{flex:0 0 auto;font-size:12px;color:var(--cream-l);padding-left:10px;border-left:1px solid rgba(255,255,255,.35)}

.viewer{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s ease}
.viewer>div{overflow:hidden}
.match.collapsed .viewer{grid-template-rows:0fr}

/* ============ 数据表（原站：米色表头 + 灰底数据格 + 米黄队名列）============ */
.tablescroll{overflow-x:auto;background:#fff}
table.datatable{
  width:100%;min-width:700px;border-collapse:separate;border-spacing:0;
  background:#fff;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"
}
.datatable th{
  background:var(--head);color:#666;font-weight:400;font-size:12px;height:30px;
  text-align:center;padding:0 4px;border-right:1px solid #fff;white-space:nowrap
}
.datatable th.teamname{width:104px;text-align:left;padding-left:10px}
.datatable td{
  background:var(--row);color:var(--ink-2);height:28px;text-align:center;
  padding:0 4px;border-right:1px solid #fff;transition:background .12s
}
.datatable th:last-child,.datatable td:last-child{border-right:none}
.datatable tbody tr:hover td{background:var(--row-hover)}
.datatable td.teamname{
  width:104px;text-align:left;padding-left:10px;
  background:var(--row-team);color:var(--ink);font-weight:700
}
.datatable tbody tr:hover td.teamname{background:#fff1dc}
.datatable td.long,.datatable th.long{min-width:74px}
.datatable .draw-tag{color:#b6bcc5;font-weight:400;font-size:12px}

/* 比例迷你条 */
.pct{position:relative}
.pct i{
  position:absolute;left:0;top:3px;bottom:3px;border-radius:0 3px 3px 0;
  background:rgba(255,153,0,.35);pointer-events:none
}
.pct span{position:relative;font-weight:700;color:#7a5a12}
.ou .pct i{background:rgba(74,144,226,.35)}
.ou .pct span{color:#3d6091}

/* 数值涨跌色：正 → 红，负 → 绿（国内习惯）
   注意必须写成 .datatable td.up 才盖得过 .datatable td 的默认色 */
.datatable td.up{color:var(--up);font-weight:700}
.datatable td.down{color:var(--down);font-weight:700}

/* ============ 底部数据条 ============ */
.dataline{
  display:flex;align-items:stretch;margin-top:1px;height:26px;font-size:12px;
  background:var(--bar)
}
.dataline .cj{
  flex:0 0 auto;padding:0 10px;line-height:26px;background:var(--bar-2);
  color:var(--bar-ink);font-weight:700;min-width:200px
}
.dataline .dltime{margin-left:auto;padding:0 10px;line-height:26px;color:#999;white-space:nowrap}

/* ============ 分页 ============ */
.pager{display:flex;align-items:center;gap:6px;padding:18px 12px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.pager .info{margin-right:12px;color:#8a939e}
.pager a,.pager b,.pager .ellipsis{
  display:inline-block;min-width:28px;height:28px;line-height:26px;text-align:center;
  padding:0 8px;border:1px solid #d5d9e0;border-radius:5px;background:#fff;color:var(--ink-2)
}
.pager b{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.pager a:hover{border-color:var(--brand);color:var(--brand-d)}
.pager a.disabled{color:#c6ccd4;pointer-events:none}

.empty{padding:60px 20px;text-align:center;color:#9aa3ae}

/* ============ 实时状态（本地服务下的自动刷新） ============ */
.live{
  display:flex;align-items:center;gap:7px;flex:0 0 auto;
  font-size:12px;color:#6b7280;white-space:nowrap
}
.live .dot{
  width:8px;height:8px;border-radius:50%;background:#c6ccd4;flex:0 0 auto;
  transition:background .2s
}
.live.on .dot{background:#18a058;box-shadow:0 0 0 3px rgba(24,160,88,.15);animation:pulse 2.2s ease-in-out infinite}
.live.busy .dot{background:var(--brand);animation:pulse .9s ease-in-out infinite}
.live.err  .dot{background:var(--up);box-shadow:0 0 0 3px rgba(217,43,43,.14)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live em{font-style:normal;color:var(--brand-d);font-weight:700;font-variant-numeric:tabular-nums}
.livebtn{
  font:inherit;font-size:12px;padding:3px 9px;border:1px solid #d5d9e0;border-radius:5px;
  background:#fff;color:var(--ink-2);cursor:pointer;transition:.15s
}
.livebtn:hover{border-color:var(--brand);color:var(--brand-d)}
.livebtn:disabled{color:#c6ccd4;border-color:#e3e6eb;cursor:default}
.live.off .livebtn{display:none}

/* 数据刚到时的轻微提示，不打断当前操作 */
.stats{transition:background .45s ease!important;border-radius:4px}
.stats.flash{background:#ffeccd}

.toast{
  /* 避让顶部站点导航条 */
  position:fixed;left:50%;top:calc(var(--navh,0px) + 14px);z-index:99;transform:translate(-50%,-18px);
  padding:8px 16px;border-radius:8px;background:rgba(28,32,38,.9);color:#fff;
  font-size:12.5px;opacity:0;pointer-events:none;transition:.25s ease;
  box-shadow:0 6px 20px rgba(0,0,0,.18)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ 响应式 ============ */
@media (max-width:1010px){
  .wrap{width:100%;box-shadow:none}
  .toolbar input[type=search]{width:140px}
}
@media (max-width:760px){
  /* 小屏：导航条改为静态 + 汉堡下拉；--navh 归零，工具条重新贴顶 */
  :root{--navh:0px}
  .sitenav{position:static}
  .sitenav-in{height:54px;gap:0}
  .sn-brand{margin-right:auto}
  .sn-brand img{height:28px}
  .sn-right{margin-left:auto;gap:0}
  .sn-burger{display:block}
  .sn-menu{
    display:none;position:absolute;left:0;right:0;top:100%;z-index:91;
    flex-direction:column;align-items:stretch;gap:0;padding:4px 0;
    background:#1c5d01;box-shadow:0 8px 18px rgba(0,0,0,.25)
  }
  .sitenav.open .sn-menu{display:flex}
  .sn-menu a{padding:12px 16px;border-radius:0;font-size:14px}
  .sn-menu a:hover{background:rgba(255,255,255,.1)}
  .sn-menu li.on a{background:rgba(0,0,0,.22)}
}
@media (max-width:640px){
  .nbar{flex-wrap:wrap;height:auto;padding:8px 10px;gap:8px}
  .ticker{order:3;flex-basis:100%}
  .stats{margin-left:0;flex-basis:100%}
  .live{margin-left:auto}
}

/* ============ 竞彩必发（bifaw）专用 ============ */
.datatable th.itemcol{width:52px}
.datatable td.itemcell{
  width:52px;text-align:center;font-weight:700;color:var(--ink)
}
.datatable td.itemcell.ou{color:#2f6b1e}
.datatable td.pctv{font-weight:700;color:#7a5a12}
.datatable tbody tr.ou-sep td{
  background:#fff7ea;color:#a06a2c;font-size:12px;text-align:left;
  padding-left:10px;height:24px
}
.datatable tbody tr.ou-sep:hover td{background:#fff7ea}
</style>
</head>
<body>

<!-- 站点导航条：与 90qu.com 首页一致，方便从数据页回到站内其它栏目。
     菜单项 / 顺序 / 链接与首页 zibll 主题的导航完全对齐，当前页标 on。 -->
<nav class="sitenav" id="sitenav">
  <div class="sitenav-in">
    <a class="sn-brand" href="https://90qu.com/" title="90qu-足球数据网">
      <img src="https://90qu.com/wp-content/uploads/2023/03/1.png" alt="90qu-足球数据网" />
    </a>
    <ul class="sn-menu" id="snMenu">
      <li><a href="https://90qu.com/archives/category/vip">今日概览</a></li>
      <li><a href="https://90qu.com/jc/">竞足数据</a></li>
      <li class="on"><a href="https://90qu.com/football/">必发数据</a></li>
      <li><a href="https://90qu.com/archives/category/%e6%95%99%e7%a8%8b">数据教程</a></li>
      <li><a href="https://90qu.com/archives/category/ziyuan">资源下载</a></li>
    </ul>
    <div class="sn-right">
      <button class="sn-burger" id="snBurger" type="button" aria-label="展开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="wrap">

  <!-- 顶栏 -->
  <div class="nbar">
    <div class="door" id="jcwrap">
      <label for="dropJc">竞彩期号：</label>
      <select id="dropJc"></select>
    </div>
    <div class="door">
      <label for="source">数据来源：</label>
      <select id="source"></select>
    </div>
    <div class="ticker" id="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
    <div class="live" id="live" title="自动刷新状态">
      <span class="dot"></span>
      <span class="ltxt" id="liveText">检查服务中…</span>
      <button class="livebtn" id="liveBtn" type="button">立即刷新</button>
    </div>
    <div class="logo">
      <div class="logo-mark">⚽</div>
      <div class="logo-text"><strong>足球指数中心</strong><span>SPORTS INDEX</span></div>
    </div>
  </div>

  <!-- 工具条 -->
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索球队 / 场次…" autocomplete="off" />
    <select id="sort">
      <option value="no">按场次顺序</option>
      <option value="time">按开赛时间</option>
      <option value="total">按总成交额 ↓</option>
      <option value="hpct">按主胜比例 ↓</option>
    </select>
    <button class="btn" id="toggleAll" type="button">全部折叠</button>
    <div class="stats" id="stats"></div>
    <!-- 数据过期提示条（仅在当前源明显过期时出现，见 paintStale） -->
    <div class="stalebar" id="stalebar" style="display:none"></div>
  </div>

  <!-- 比赛列表 -->
  <div id="list"></div>

  <!-- 分页 -->
  <div class="pager" id="pager"></div>

</div>

<div class="toast" id="toast"></div>

<!-- 内联快照 data-inline.js 改为按需动态加载：线上跑 http 时只拉 data.json，
     省掉一半流量；用 file:// 双击打开时才会加载它 -->
<script>
(function(){
  "use strict";

  var PER_PAGE = 8;

  /* 数据源：spdex（超级指数）/ bifaw（竞彩必发）。
     两者表结构与字段语义完全不同，所以走「适配器」：每个源把原始 JSON
     翻译成外壳认识的统一形态，搜索 / 排序 / 折叠 / 分页 / 状态条 / 播报
     全部共用，不必为第二个源再写一套交互。 */
  var state = {
    src:"spdex", cache:{}, page:1, q:"", sort:"no",
    allCollapsed:false, collapsed:{}, booting:false
  };

  /* 常见球队简称 → 全称，便于用「曼联」搜到「曼彻斯特联」 */
  var ALIAS = {
    "曼联":"曼彻斯特联", "曼城":"曼彻斯特城", "红魔":"曼彻斯特联", "蓝月亮":"曼彻斯特城",
    "皇马":"皇家马德里", "马竞":"马德里竞技", "巴萨":"巴塞罗那", "拜仁":"拜仁慕尼黑",
    "尤文":"尤文图斯", "国米":"国际米兰", "巴黎":"巴黎日尔曼", "大巴黎":"巴黎日尔曼",
    "枪手":"阿森纳", "热刺":"托特纳姆热刺", "红军":"利物浦", "蓝军":"切尔西",
    "多特":"多特蒙德", "药厂":"勒沃库森", "米兰":"AC米兰"
  };
  var ALIAS_BY_TEAM = (function(){
    var map = {};
    Object.keys(ALIAS).forEach(function(k){
      var full = ALIAS[k];
      (map[full] = map[full] || []).push(k);
    });
    return map;
  })();

  /* ---------- 工具函数 ---------- */
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function num(s){ // "17%" -> 17 ; "1,234" -> 1234
    var v = parseFloat(String(s||"").replace(/[^0-9.\-]/g,""));
    return isNaN(v) ? 0 : v;
  }
  function fmt(n){ return n.toLocaleString("en-US"); }
  function kickoffTs(s){
    var m = String(s||"").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{2})/);
    if(m) return +new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    m = String(s||"").match(/(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{2})/);   // "09-16 18:00"
    if(!m) return 0;
    return +new Date(new Date().getFullYear(), +m[1]-1, +m[2], +m[3], +m[4]);
  }

  /* ---------- 数据新鲜度 ----------
     抓取脚本的「绝不用坏数据覆盖好数据」是把双刃剑：源站挂了会一直保留上一份，
     页面却看不出这份数据是三天前的。所以这里统一算「抓取时间距今多久」，
     并在过期时把提示摆到明面上。 */
  function parseTs(s){
    if(!s) return 0;
    var t = Date.parse(String(s).replace(/-/g,"/").replace("T"," ").replace(/\..*$/,""));
    return isNaN(t) ? 0 : t;
  }
  function ageText(ms){
    if(ms < 0) ms = 0;
    var m = Math.floor(ms/60000);
    if(m < 1) return "刚刚";
    if(m < 60) return m + " 分钟前";
    var h = Math.floor(m/60);
    if(h < 24) return h + " 小时前";
    var d = Math.floor(h/24);
    return d + " 天" + (h % 24 ? " " + (h % 24) + " 小时" : "") + "前";
  }
  var STALE_WARN = 3*3600*1000;    // 超过 3 小时：黄色提醒
  var STALE_BAD  = 12*3600*1000;   // 超过 12 小时：红色告警
  function freshness(view){
    var ts = parseTs(view && view.fetchedAt);
    if(!ts) return {ts:0, age:0, text:"", level:""};
    var age = Date.now() - ts;
    return {ts:ts, age:age, text:ageText(age),
            level: age > STALE_BAD ? "bad" : (age > STALE_WARN ? "warn" : "")};
  }
  /* 两份数据里抓取时间最新的那个（都不可用时返回 null） */
  function fresherKey(){
    var best = null, bt = -1;
    SRC_KEYS.forEach(function(k){
      var v = state.cache[k];
      if(!v) return;
      var ts = parseTs(v.fetchedAt);
      if(ts > bt){ bt = ts; best = k; }
    });
    return best;
  }
  function signCls(v){ // 正 → 红，负 → 绿（国内习惯）
    var n = num(v);
    if(n > 0) return "up";
    if(n < 0) return "down";
    return "";
  }
  function pctCell(v, isOU){
    var n = Math.max(0, Math.min(100, num(v)));
    return '<td class="pct' + (isOU ? " ou" : "") + '">' +
             '<i style="width:' + n + '%"></i><span>' + esc(v) + "</span></td>";
  }
  /* 子序列匹配：「曼联」是「曼彻斯特联」的子序列，容错更高 */
  function subseq(q, s){
    if(!s) return false;
    var i = 0;
    for(var j = 0; j < s.length && i < q.length; j++){
      if(s.charAt(j) === q.charAt(i)) i++;
    }
    return i >= q.length;
  }
  function searchKey(it){
    var extra = [];
    [it.home, it.away].forEach(function(t){
      (ALIAS_BY_TEAM[t] || []).forEach(function(a){ extra.push(a); });
    });
    return (it.title + " " + it.home + " " + it.away + " " + it.kickoff + " " +
            extra.join(" ")).toLowerCase();
  }
  const topN = (arr, n, key) => arr.sort((a,b) => num(b[key]) - num(a[key])).slice(0, n);

  /* ================= 适配器 ================= */
  var ADAPTERS = {

    /* ---------------- 超级指数（c.spdex.com/spdexlehejc） ---------------- */
    spdex: {
      name: "超级指数",
      enabled: false,      // ⛔ 源站已改成会员登录站（2026-09-16 下线），见 SRC_KEYS 注释
      file: "data.json",
      inlineKey: "__DATA__",
      inlineFile: "data-inline.js",
      volLabel: "总成交",
      emptyTip: '没有 spdex 数据。请先运行 <b>python spdex_fetch.py</b> 生成 data.json。',

      build: function(d){
        var cols = (d.columns || []).map(function(c){
          var cls = c === "球队队名" ? "teamname" : (/交易量/.test(c) ? "long" : "");
          return "<th" + (cls ? ' class="' + cls + '"' : "") + ">" + esc(c) + "</th>";
        }).join("");

        function rowHtml(r){
          var nameCell = r.name
            ? '<td class="teamname">' + esc(r.name) + "</td>"
            : '<td class="teamname"><span class="draw-tag">平局</span></td>';
          return "<tr>" + nameCell +
            "<td>" + esc(r.idx) + "</td>" +
            '<td class="long">' + esc(r.vol) + "</td>" +
            pctCell(r.pct, false) +
            '<td class="' + signCls(r.pay) + '">' + esc(r.pay) + "</td>" +
            "<td>" + esc(r.price) + "</td>" +
            '<td class="' + signCls(r.listed) + '">' + esc(r.listed) + "</td>" +
            "<td>" + esc(r.euro) + "</td>" +
            "<td>" + esc(r.kelly) + "</td>" +
            '<td class="long">' + esc(r.ouVol) + "</td>" +
            (r.ouPct ? pctCell(r.ouPct, true) : "<td></td>") +
            "<td>" + esc(r.ouPrice) + "</td>" +
            "<td>" + esc(r.ouIdx) + "</td>" +
          "</tr>";
        }

        var items = (d.matches || []).map(function(m){
          return {
            id: m.id,
            title: m.title,
            home: m.home, away: m.away, kickoff: m.kickoff,
            total: m.total, updateTime: m.updateTime,
            volNum: num(m.total),
            hpctNum: num(m.rows && m.rows[0] && m.rows[0].pct),
            tableHtml: '<table class="datatable">' +
              "<thead><tr>" + cols + "</tr></thead>" +
              "<tbody>" + (m.rows || []).map(rowHtml).join("") + "</tbody>" +
            "</table>"
          };
        });

        // 播报：全部场次按单项交易量取 Top6
        var tops = [];
        (d.matches || []).forEach(function(m){
          (m.rows || []).forEach(function(r, i){
            if(!r.vol) return;
            tops.push({

              side: i === 0 ? "主胜" : (i === 2 ? "客胜" : "平局"),

            });
          });
        });
        var bits = topN(tops, 6, "vol").map(function(t){
          return "<b>比赛</b>:" + esc(t.match) + " 市场:标准盘 " + esc(t.side) +
                 ":<u>" + esc(t.vol) + "</u> 价位:" + esc(t.price) + " 时间:" + esc(t.time);
        });

        var totalVol = (d.matches || []).reduce(function(s,m){ return s + num(m.total); }, 0);
        return {
          label: d.date + " 期",
          docTitle: d.date + " 期 · 足球指数中心",
          dataDate: d.date,
          items: items,
          tickerPrefix: "必发交易所交易量 Top6",
          tickerBits: bits,
          fetchedAt: d.fetchedAt || "",
          statsHtml: "共 <em>" + items.length + "</em> 场 · 总成交 <em>" +
                     fmt(totalVol) + "</em> · 数据更新 " + esc(d.fetchedAt || "-")
        };
      }
    },

    /* ---------------- 竞彩必发（bifaw.com/bifaw/sporttery.php） ---------------- */
    bifaw: {
      name: "竞彩必发",
      enabled: true,
      file: "bifaw.json",
      inlineKey: "__BIFAW__",
      inlineFile: "bifaw-inline.js",
      volLabel: "总成交量",
      emptyTip: '没有竞彩必发数据。请先运行 <b>python bifaw_fetch.py</b> 生成 bifaw.json。',

      build: function(d){
        var cols = '<th class="itemcol">项</th>' + (d.columns || []).map(function(c){
          return "<th>" + esc(c) + "</th>";
        }).join("");
        var PRO = (d.columns || []).indexOf("盈亏");
        var PCT = (d.columns || []).indexOf("比例");

        function rowHtml(r, isOU){
          var tds = (r.v || []).map(function(v, i){
            var k = "";
            if(i === PRO) k = signCls(v);

            '<td class="teamname itemcell' + (isOU ? " ou" : "") + '">' +

        }

        var items = (d.matches || []).map(function(m){
          var body = (m.rows || []).map(function(r){ return rowHtml(r, false); }).join("");
          if((m.ou || []).length){

                      (m.ouLine ? "大小球 " + esc(m.ouLine) : "大小球") +
                      (m.ouTotal ? "　总成交量 " + esc(m.ouTotal) : "") +
                    "</td></tr>";
            body += (m.ou || []).map(function(r){ return rowHtml(r, true); }).join("");
          }
          return {
            id: m.id,

                   (m.home ? "　" + m.home + " VS " + m.away : ""),

            total: m.total, updateTime: d.fetchedAt,

        (d.matches || []).forEach(function(m){
          (m.rows || []).forEach(function(r){

            if(!v[VOLC]) return;
            tops.push({
              match: m.home + " VS " + m.away,
              side: r.item === "主" ? "主胜" : (r.item === "客" ? "客胜" : "和局"),

            });
          });

                 ":<u>" + esc(t.vol) + "</u> 价位:" + esc(t.price) + " 时间:" + esc(t.time);
        });

        var totalVol = (d.matches || []).reduce(function(s,m){ return s + num(m.total); }, 0);
        return {
          label: "竞彩必发",
          docTitle: "竞彩必发 · 足球指数中心",

          tickerPrefix: "竞彩必发成交量 Top6",
          tickerBits: bits,
          fetchedAt: d.fetchedAt || "",
          statsHtml: "共 <em>" + items.length + "</em> 场 · 总成交量 <em>" +
                     fmt(totalVol) + "</em> · 数据更新 " + esc(d.fetchedAt || "-")
        };

  };

  /* ---------- 启用中的数据源 ----------
     ⛔ 超级指数（c.spdex.com）已于 2026-09-16 下线：源站整体改成会员登录站，
        老页面没了，抓取每轮「一场都没抓到」。适配器代码保留着（enabled:false），
        以后拿到账号要恢复，把它的 enabled 改成 true 即可，别的都不用动。
     下拉选项、启动加载、默认源选择、过期提示的「另一源」比较，全部由这份清单驱动，
     所以下线/恢复一个源只需要改这一个地方。 */
  var SRC_KEYS = Object.keys(ADAPTERS).filter(function(k){
    return ADAPTERS[k].enabled !== false;
  });

  function buildSourceOptions(){
    var sel = document.getElementById("source");
    if(!sel) return;
    sel.innerHTML = SRC_KEYS.map(function(k){
      return '<option value="' + esc(k) + '">' + esc(ADAPTERS[k].name) + "</option>";
    }).join("");
  }

  /* ---------- 渲染：交易播报 ---------- */
  function renderTicker(view){
    var tk = document.getElementById("ticker");
    if(!view || !view.tickerBits || !view.tickerBits.length){
      tk.style.display = "none";
      return;
    }
    tk.style.display = "";
    var head = '<span style="color:#3300ff"><strong>竞彩指数快报</strong></span> --- ' +
               view.tickerPrefix + "：" + view.tickerBits.join(" --- ") + " --- ";
    document.getElementById("tickerTrack").innerHTML = head + head;   // 复制一份实现无缝循环
  }

  /* ---------- 渲染：单场比赛 ---------- */
  function matchHtml(it){
    var isC = !!state.collapsed[it.id];
    return '<div class="match' + (isC ? " collapsed" : "") + '" data-id="' + esc(it.id) + '">' +
      '<div class="datatitle" role="button" tabindex="0" aria-expanded="' + (isC ? "false" : "true") + '">' +
        "<h3>" + esc(it.title) + "</h3>" +
        '<span class="matchtime">开赛时间：' + esc(it.kickoff || "-") + "</span>" +
      "</div>" +
      '<div class="viewer"><div>' +
        '<div class="tablescroll">' + it.tableHtml + "</div>" +
        '<div class="dataline">' +
          '<span class="cj">' + esc(ADAPTERS[state.src].volLabel) + "：" +
             esc(it.total || "-") + "</span>" +
          '<span class="dltime">更新时间：' + esc(it.updateTime || "-") + "</span>" +
        "</div>" +
      "</div></div>" +
    "</div>";
  }

  /* ---------- 渲染：分页 ---------- */
  function renderPager(total, pages, label){
    var el = document.getElementById("pager");
    if(pages <= 1){
      el.innerHTML = total
        ? '<span class="info">' + esc(label || "") + " 共 " + total + " 场</span>" : "";
      return;
    }
    var p = state.page;
    var html = '<span class="info">' + esc(label || "") + " 第 " + p + " 页，共 " + pages +
               " 页（" + total + " 场）</span>";
    html += '<a class="' + (p === 1 ? "disabled" : "") + '" data-p="1">&laquo;</a>';
    html += '<a class="' + (p === 1 ? "disabled" : "") + '" data-p="' + (p-1) + '">&lsaquo;</a>';
    for(var i = 1; i <= pages; i++){
      html += (i === p) ? "<b>" + i + "</b>" : '<a data-p="' + i + '">' + i + "</a>";
    }
    html += '<a class="' + (p === pages ? "disabled" : "") + '" data-p="' + (p+1) + '">&rsaquo;</a>';
    html += '<a class="' + (p === pages ? "disabled" : "") + '" data-p="' + pages + '">&raquo;</a>';
    el.innerHTML = html;
  }

  /* ---------- 主渲染 ---------- */
  function currentView(){ return state.cache[state.src]; }

  function render(){
    var view = currentView();
    if(!view){
      document.getElementById("list").innerHTML =
        '<div class="empty">' + ADAPTERS[state.src].emptyTip + "</div>";
      document.getElementById("pager").innerHTML = "";
      document.getElementById("stats").innerHTML = "等待数据…";
      return;
    }
    var rows = view.items.slice();

    // 搜索：全称/简称/子串/子序列 均可命中
    if(state.q){
      var q = state.q.toLowerCase();
      rows = rows.filter(function(it){
        var key = it.__key || (it.__key = searchKey(it));
        return key.indexOf(q) > -1 || subseq(q, it.home) || subseq(q, it.away);
      });
    }
    // 排序
    if(state.sort === "time"){
      rows.sort(function(a,b){ return kickoffTs(a.kickoff) - kickoffTs(b.kickoff); });
    }else if(state.sort === "total"){
      rows.sort(function(a,b){ return b.volNum - a.volNum; });
    }else if(state.sort === "hpct"){
      rows.sort(function(a,b){ return b.hpctNum - a.hpctNum; });
    }

    var pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
    if(state.page > pages) state.page = pages;
    var slice = rows.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

    document.getElementById("list").innerHTML = slice.length
      ? slice.map(matchHtml).join("")
      : '<div class="empty">没有匹配的比赛，换个关键词试试。</div>';

    renderPager(rows.length, pages, view.label);
    var fr = freshness(view), extra = "";
    if(fr.text){
      extra = ' · <span class="age ' + fr.level + '" title="抓取时间 ' + esc(view.fetchedAt) + '">' +
              esc((fr.level === "bad" ? "数据已过期 · " : "") + fr.text) + "</span>";
    }
    document.getElementById("stats").innerHTML = view.statsHtml + extra;
  }

  /* ---------- 事件 ---------- */
  function bind(){
    var q = document.getElementById("q");
    var t;
    q.addEventListener("input", function(){
      clearTimeout(t);
      t = setTimeout(function(){ state.q = q.value.trim(); state.page = 1; render(); }, 180);
    });

    document.getElementById("sort").addEventListener("change", function(e){
      state.sort = e.target.value; state.page = 1; render();
    });

    document.getElementById("source").addEventListener("change", function(e){
      switchSource(e.target.value, true);
    });

    // 数据过期提示条上的「切过去看」
    var bar = document.getElementById("stalebar");
    if(bar){
      bar.addEventListener("click", function(e){
        var b = e.target.closest("button[data-goto]");
        if(b) switchSource(b.getAttribute("data-goto"), true);
      });
    }

    document.getElementById("toggleAll").addEventListener("click", function(e){
      state.allCollapsed = !state.allCollapsed;
      e.target.textContent = state.allCollapsed ? "全部展开" : "全部折叠";
      var view = currentView();
      ((view && view.items) || []).forEach(function(it){
        state.collapsed[it.id] = state.allCollapsed;
      });
      render();
    });

    // 手动触发一次抓取（仅本地服务模式可用）
    document.getElementById("liveBtn").addEventListener("click", function(){
      var b = this;
      b.disabled = true;
      fetch("/api/refresh", { method: "POST" })
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(){ toast("已触发抓取，约 30 秒后自动更新…"); })
        .catch(function(){ toast("本地服务未响应"); })
        .then(function(){ setTimeout(function(){ b.disabled = false; }, 2500); });
    });

    document.getElementById("list").addEventListener("click", function(e){
      var title = e.target.closest(".datatitle");
      if(!title) return;
      var match = title.parentNode;
      var collapsed = match.classList.toggle("collapsed");
      title.setAttribute("aria-expanded", collapsed ? "false" : "true");
      state.collapsed[match.getAttribute("data-id")] = collapsed;
    });
    document.getElementById("list").addEventListener("keydown", function(e){
      if(e.key !== "Enter" && e.key !== " ") return;
      var title = e.target.closest(".datatitle");
      if(!title) return;
      e.preventDefault();
      title.click();
    });

    document.getElementById("pager").addEventListener("click", function(e){
      var a = e.target.closest("a[data-p]");
      if(!a || a.classList.contains("disabled")) return;
      state.page = parseInt(a.getAttribute("data-p"), 10) || 1;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  /* ---------- 提示 ---------- */
  function flashStats(){
    var el = document.getElementById("stats");
    if(!el) return;
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1000);
  }

  var toastTimer;
  function toast(msg){
    var el = document.getElementById("toast");
    if(!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2800);
  }

  /* ---------- 切换数据源 ---------- */
  var LS_SRC = "spdex_src_pref";       // 记住用户手动选的源

  function switchSource(key, announce){
    if(!ADAPTERS[key]) return;
    var changed = state.src !== key;
    state.src = key;
    var sel = document.getElementById("source");
    if(sel) sel.value = key;
    if(changed) state.page = 1;
    if(state.cache[key]){
      paintSource();
      render();
      flashStats();
      paintLive();
      if(announce) toast("已切换到 " + ADAPTERS[key].name);
    }else{
      loadSource(key, announce);
    }
    // 只记住「用户自己点出来的」选择；启动时的自动选择不算
    if(announce){
      try{ localStorage.setItem(LS_SRC, key); }catch(e){}
    }
  }

  /* 首屏该显示哪个源：
     1) 用户上次手动选过的、且数据没过期的那个；
     2) 否则默认清单里的第一个源（也就是主源）；
     3) 主源没数据或已过期 —— 例如源站改版停更 —— 才自动落到抓取时间最新的那份。
     不写死某个源的原因：源站一停更，首屏就会一直摆着几天前的旧数据而无人察觉。 */
  function defaultSourceKey(){
    var PREF = SRC_KEYS[0];
    if(!PREF) return null;
    try{
      var saved = localStorage.getItem(LS_SRC);
      if(saved && SRC_KEYS.indexOf(saved) > -1 && state.cache[saved] &&
         freshness(state.cache[saved]).level !== "bad") return saved;
    }catch(e){}
    var v = state.cache[PREF];
    if(v && freshness(v).level !== "bad") return PREF;
    return fresherKey() || PREF;
  }

  function paintSource(){
    var view = state.cache[state.src];
    // 竞彩必发没有「期号」概念，切开时隐藏期号下拉
    var wrap = document.getElementById("jcwrap");
    if(wrap) wrap.style.display = state.src === "spdex" ? "" : "none";
    if(view){
      document.title = view.docTitle;
      document.getElementById("dropJc").innerHTML =
        '<option value="1">' + esc(view.label) + "</option>";
      renderTicker(view);
    }
    paintStale();
    refreshSourceOptions();
  }

  /* ---------- 数据过期提示 ----------
     当前源的数据明显过期时，把「抓的是什么时候的、更新的在哪一份」讲清楚，
     并给一个直接切过去的按钮。 */
  function paintStale(){
    var bar = document.getElementById("stalebar");
    if(!bar) return;
    var view = currentView();
    var fr = freshness(view);
    if(!fr.level){                                  // 当前源足够新，不打扰
      bar.style.display = "none";
      return;
    }
    // 在「启用中的」其它源里找有没有更新的（已下线的源不参与比较）
    var otherKey = null, ofr = {ts: 0};
    SRC_KEYS.forEach(function(k){
      if(k === state.src) return;
      var o = state.cache[k];
      if(!o) return;
      var f = freshness(o);
      if(f.ts > ofr.ts){ ofr = f; otherKey = k; }
    });
    var other = otherKey ? state.cache[otherKey] : null;

    var msg = ADAPTERS[state.src].name + " 的数据抓取于 " +
              ((view && view.fetchedAt) || "未知时间") + "（" + fr.text + "）";
    if(view && view.dataDate) msg += "，期号 " + view.dataDate;
    msg += "，可能已经过期。";

    var btn = "";
    if(other && ofr.ts > fr.ts){
      msg += " 更新的数据在 " + ADAPTERS[otherKey].name + "（" +
             (other.fetchedAt || "") + "）。";
      btn = '<button type="button" data-goto="' + esc(otherKey) + '">切过去看</button>';
    }

    bar.className = "stalebar " + fr.level;
    bar.innerHTML = "<b>" + (fr.level === "bad" ? "数据已过期" : "数据提醒") + "</b>" +
                    "<span>" + esc(msg) + "</span>" + btn;
    bar.style.display = "";
  }

  /* 数据源下拉里标出各源的数据时间，避免选到空壳或过期的那份 */
  function refreshSourceOptions(){
    var sel = document.getElementById("source");
    if(!sel) return;
    for(var i = 0; i < sel.options.length; i++){
      var o = sel.options[i], k = o.value, v = state.cache[k];
      if(!ADAPTERS[k]) continue;
      var tag = "";
      if(!v) tag = "（暂无数据）";
      else if(v.fetchedAt) tag = "（" + String(v.fetchedAt).slice(5, 16) + "）";
      o.textContent = ADAPTERS[k].name + tag;
    }
  }

  function applyData(key, d, announce){
    state.cache[key] = ADAPTERS[key].build(d);
    if(state.booting) return;      // 启动阶段先不画，等两个源都到齐再决定显示谁
    if(key !== state.src) return;
    paintSource();
    render();
    paintLive();
    flashStats();
    if(announce) toast(ADAPTERS[key].name + " 数据已更新 · " + (d.fetchedAt || ""));
  }

  /* ---------- 数据装载（本地服务 / 静态托管 / file:// 三种环境共用） ---------- */
  function inlineSnapshot(ad){
    return new Promise(function(resolve){
      if(window[ad.inlineKey]){ resolve(window[ad.inlineKey]); return; }
      var s = document.createElement("script");
      s.src = ad.inlineFile;
      s.onload = function(){ resolve(window[ad.inlineKey] || null); };
      s.onerror = function(){ resolve(null); };
      document.head.appendChild(s);
    });
  }

  var canFetch = location.protocol === "http:" || location.protocol === "https:";

  function loadSource(key, announce){
    var ad = ADAPTERS[key];
    var loader = canFetch
      ? fetch(ad.file + "?_=" + Date.now(), { cache: "no-store" })
          .then(function(r){ if(!r.ok) throw 0; return r.json(); })
          .catch(function(){ return null; })
      : Promise.resolve(null);
    return loader.then(function(d){
      return d ? d : inlineSnapshot(ad);
    }).then(function(d){
      if(!d){
        state.cache[key] = null;
        if(state.booting) return;          // 启动阶段交给 defaultSourceKey 收尾
        if(key === state.src){ paintSource(); render(); }
        return;
      }
      applyData(key, d, announce);
    });
  }

  /* ---------- 实时刷新（配合 spdex_server.py） ---------- */
  var live = { on:false, started:false, seq:-1, es:null, st:null, left:0, tick:null, polling:false };

  function mmss(sec){
    sec = Math.max(0, sec | 0);
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function paintLive(){
    var el = document.getElementById("live");
    var tx = document.getElementById("liveText");
    var bt = document.getElementById("liveBtn");
    if(!el || !tx) return;

    if(!live.on){                       // 没有本地服务：静态托管或 file:// 打开
      el.className = "live off";
      var view = currentView();
      var ft = view && view.fetchedAt;
      if(ft){
        tx.textContent = "数据更新 " + ft.slice(5, 16);
        el.title = "本页数据抓取于 " + ft + "（静态页面，需在服务器端更新数据文件）";
      }else{
        tx.textContent = "静态数据";
        el.title = "静态页面";
      }
      return;
    }
    var s = live.st || {};
    var manual = !s.interval;       // 服务端关掉了自动抓取 → 不显示误导性的倒计时
    bt.disabled = !!s.running;
    if(s.running){
      el.className = "live on busy";
      tx.textContent = "正在抓取…";
      el.title = "服务正在抓取最新数据（会弹出浏览器窗口，属正常）";
    }else if(s.error){
      el.className = "live on err";
      tx.innerHTML = manual ? "抓取失败"
                            : "抓取失败 · <em>" + mmss(live.left) + "</em> 后重试";
      el.title = s.error;
    }else{
      el.className = "live on";
      tx.innerHTML = manual ? "手动刷新"
                            : "自动刷新 · 剩 <em>" + mmss(live.left) + "</em>";
      el.title = "上次抓取 " + (s.lastOkAt || "-") + "　数据时间 " + (s.fetchedAt || "-");
    }
  }

  function onStatus(s){
    live.st = s;
    live.left = s.nextRunIn || 0;
    if(!live.on){
      live.on = true;
      live.seq = s.seq;               // 首帧只记录版本号，避免刚打开就重复拉取
    }else if(s.seq !== live.seq){
      live.seq = s.seq;               // 服务端抓到了新数据 → 立刻重载并保留用户当前视图
      reloadAll(true);
    }
    paintLive();
    if(!live.tick){
      live.tick = setInterval(function(){
        if(live.left > 0) live.left--;
        paintLive();
      }, 1000);
    }
  }

  function reloadAll(announce){
    SRC_KEYS.forEach(function(k){
      loadSource(k, k === state.src && announce);
    });
  }

  function openSSE(){
    if(live.es) return;
    try{                                // SSE 优先，断线浏览器会自动重连
      live.es = new EventSource("/api/events");
      live.es.onmessage = function(e){
        try{ onStatus(JSON.parse(e.data)); }catch(_){}
      };
    }catch(_){}
  }

  function probe(){
    if(live.polling) return;
    live.polling = true;
    fetch("/api/status", { cache: "no-store" })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(s){
        if(!s || typeof s.seq !== "number") throw 0;
        live.started = true;
        openSSE();
        onStatus(s);
      })
      .catch(function(){ /* 虚拟主机等静态托管：没有后端，保持静态模式，此后不再发请求 */ })
      .then(function(){ live.polling = false; });
  }

  function startLive(){
    probe();                            // 先探一次后端，探不到就完全不启用（静态页面零额外请求）
    setInterval(function(){ if(live.started) probe(); }, 15000);   // 实时模式下的轮询兜底
  }

  /* ---------- 启动 ---------- */
  // 是否探测本地实时服务。publish.py 生成静态发布包时会把下面这行改成 false：
  // 线上没有本地服务，连探测都不必发，避免每个访客都白打一次 404
  var LIVE_PROBE = true;

  buildSourceOptions();
  if(SRC_KEYS.indexOf(state.src) < 0) state.src = SRC_KEYS[0] || state.src;

  // 启用中的源并行取回，都到齐后再决定首屏显示谁（见 defaultSourceKey）。
  // 不能像以前那样「先画第一个源就算完」：那个源一旦停更，页面会一直显示
  // 几天前的数据，而另一个源的今日数据其实已经拿到了。
  state.booting = true;
  Promise.all(SRC_KEYS.map(function(k){ return loadSource(k, false); }))
    .then(function(){
      state.booting = false;
      var best = defaultSourceKey();
      if(best && best !== state.src){
        switchSource(best, false);
      }else{
        paintSource();
        render();
        paintLive();
      }
      bind();
      if(canFetch && LIVE_PROBE) startLive();
      // 数据年龄会随时间增长，每分钟重算一次过期提示（只动状态条，不重画列表）
      setInterval(paintStale, 60000);
    });
})();
</script>

<!-- 站点导航条：小屏汉堡菜单开合（点空白处收起） -->
<script>
(function(){
  var bar = document.getElementById("sitenav");
  var btn = document.getElementById("snBurger");
  if(!bar || !btn) return;
  function setOpen(open){
    if(open) bar.classList.add("open"); else bar.classList.remove("open");
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  btn.addEventListener("click", function(){
    setOpen(!bar.classList.contains("open"));
  });
  document.addEventListener("click", function(e){
    if(bar.classList.contains("open") && !bar.contains(e.target)) setOpen(false);
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") setOpen(false);
  });
})();
</script>
</body>
